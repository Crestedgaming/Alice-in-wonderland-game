<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>escape-room-game</title>
</head>

<body>
  <header>
    <div>
      <nav id="falletNavBar" class="falletNavBar">
        <label>
          <button id="resetAndStartGameBtn" class="resetAndStartGameBtn">Börja om<i class='fas fa-undo'
              style='font-size:48px;color:red'></i></button>
        </label>
        <h1 id="rumID" class="navBarElement">Titel</h1>
        <span id="rumPositionISpelet" class="navBarElement">Rum 1 av 6</span>
        <span id="falletTimer" class="navBarElement">Din tid: 00.00</span>
        <label>
          <button id="goBackBtn" class="goBackBtn">Gå tillbaka<i class='fas fa-long-arrow-alt-left'
              style='font-size:48px;color:red'></i></button>
        </label>
      </nav>
    </div>
  </header>
  <main>
    <!-- Startsida -->
    <div id="app"></div>
    <!-- rum1 -->
    <div id="rum1" class="room hidden">
      <h2>Rum 1</h2>
      <p>Välkommen till rum 1!</p>
    </div>
    <!-- rum2 -->
    <div id="rum2" class="room hidden">
      <h2>Rum 2</h2>
      <p>Välkommen till rum 2!</p>
    </div>
    <!-- rum3 -->
    <div id="rum3" class="room hidden">
      <h2>Rum 3</h2>
      <p>Välkommen till rum 3!</p>
    </div>
    <!-- rum4 -->
    <div id="rum4" class="room hidden">
      <h2>Rum 4</h2>
      <p>Välkommen till rum 4!</p>
    </div>
    <!-- rum5 -->
    <div id="rum5" class="room hidden">
      <h2>Rum 5</h2>
      <p>Välkommen till rum 5!</p>
    </div>
    <!-- rum6 -->
    <div id="rum6" class="room hidden">
      <h2>Rum 6</h2>
      <p>Välkommen till rum 6!</p>
    </div>
  </main>
  <footer>
    <div id="visaArtefakter" class="visaArtefakter">
      <ul>
        <li id="artefakt1" class="artefakter"><span>V</span></li>
        <li id="artefakt2" class="artefakter"><span>A</span></li>
        <li id="artefakt3" class="artefakter"><span>K</span></li>
        <li id="artefakt4" class="artefakter"><span>N</span></li>
        <li id="artefakt5" class="artefakter"><span>A</span></li>
      </ul>
    </div>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
